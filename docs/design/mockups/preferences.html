<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuotaBar mockup - Preferences</title>
  <style>
    :root { color-scheme: light dark; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#202126; color:#f5f5f7; }
    .review { max-width:1260px; margin:0 auto; padding:32px 24px 48px; }
    .review-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:22px; }
    h1 { margin:0 0 6px; font-size:24px; letter-spacing:-.02em; }
    .lede { margin:0; color:#aeb0b8; font-size:14px; }
    .files { display:flex; flex:none; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
    .files a { color:#d7d8de; text-decoration:none; font-size:12px; padding:6px 9px; border:1px solid #454750; border-radius:7px; }
    .files a[aria-current="page"] { background:#f2f2f7; border-color:#f2f2f7; color:#191a1e; }
    .board { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
    figure { margin:0; }
    figcaption { margin:0 0 9px 2px; color:#c8c9cf; font-size:12px; font-weight:600; }
    .scene { --ink:#1c1c1e; --muted:#6e6e73; --faint:#8e8e93; --line:rgba(60,60,67,.17); --window:rgba(246,246,248,.98); --card:rgba(255,255,255,.72); --control:rgba(118,118,128,.12); --accent:#0a84ff; position:relative; min-height:960px; overflow:hidden; border-radius:18px; color:var(--ink); background:radial-gradient(circle at 18% 16%,#f3c3d9 0 9%,transparent 28%),linear-gradient(145deg,#7f86f6 0%,#c994d8 43%,#5969ec 100%); }
    .scene.dark { --ink:#f5f5f7; --muted:#b6b6bd; --faint:#8e8e98; --line:rgba(255,255,255,.12); --window:rgba(35,35,39,.98); --card:rgba(255,255,255,.055); --control:rgba(255,255,255,.09); --accent:#0a84ff; background:radial-gradient(circle at 72% 24%,#442e68 0 8%,transparent 31%),linear-gradient(145deg,#111529,#352044 52%,#101936); }
    .menu-bar { height:30px; display:flex; align-items:center; justify-content:space-between; padding:0 13px; color:#17171a; background:rgba(246,246,249,.76); font-size:12px; font-weight:600; backdrop-filter:blur(20px); }
    .dark .menu-bar { color:#f8f8fa; background:rgba(18,18,21,.72); }
    .status-group,.status-item { display:flex; align-items:center; }
    .status-group { gap:13px; }
    .status-item { gap:4px; padding:3px 6px; border-radius:5px; background:rgba(255,255,255,.26); }
    .dark .status-item { background:rgba(255,255,255,.1); }
    .status-item svg { width:13px; height:13px; color:#c76749; }
    .status-item span { min-width:30px; text-align:right; font-variant-numeric:tabular-nums; }
    .dark .status-item svg { color:#d97757; }
    .window { width:510px; margin:18px auto 28px; overflow:hidden; border:1px solid rgba(255,255,255,.48); border-radius:12px; background:var(--window); box-shadow:0 22px 55px rgba(0,0,0,.3),0 2px 9px rgba(0,0,0,.18); }
    .titlebar { position:relative; display:flex; align-items:center; justify-content:center; height:36px; border-bottom:1px solid var(--line); font-size:12px; font-weight:650; }
    .lights { position:absolute; left:13px; display:flex; gap:7px; }
    .light-dot { width:12px; height:12px; border-radius:50%; background:#ff5f57; }
    .light-dot:nth-child(2){ background:#febc2e }.light-dot:nth-child(3){ background:#28c840 }
    .pane { padding:17px 18px 20px; }
    .section-title { margin:15px 7px 6px; color:var(--muted); font-size:11px; font-weight:650; }
    .section-title:first-child { margin-top:0; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--card); }
    .row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:center; min-height:42px; padding:8px 11px; font-size:12px; }
    .row + .row { border-top:1px solid var(--line); }
    .row small { display:block; margin-top:2px; color:var(--muted); font-size:9.5px; line-height:1.3; }
    .select { min-width:112px; padding:5px 23px 5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--control); text-align:left; font-size:11px; }
    .select::after { content:"⌄"; float:right; margin-right:-15px; color:var(--muted); }
    .switch { position:relative; width:30px; height:18px; border-radius:999px; background:#8e8e93; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:white; box-shadow:0 1px 2px rgba(0,0,0,.28); }
    .switch.on { background:var(--accent); }
    .switch.on::after { left:14px; }
    .provider-row { grid-template-columns:20px minmax(0,1fr) auto; gap:8px; min-height:39px; padding-block:6px; }
    .provider-row svg { width:15px; height:15px; color:var(--brand); }
    .provider-status { text-align:right; color:var(--muted); font-size:9.5px; }
    .provider-status.unresolved { color:#c94d3a; }
    .dark .provider-status.unresolved { color:#ff8978; }
    .provider-control { display:flex; align-items:center; gap:9px; }
    .recommendation { margin:7px 7px 0; color:var(--muted); font-size:9.5px; line-height:1.4; }
    .legend { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 14px; margin:10px 7px 0; padding-top:9px; border-top:1px solid var(--line); color:var(--muted); font-size:9px; line-height:1.35; }
    .legend strong { font-weight:650; }
    .legend .ok { color:#2f7451; }
    .dark .legend .ok { color:#69d78a; }
    .legend .neutral { color:var(--muted); }
    .legend .warn { color:#9b4d1f; }
    .dark .legend .warn { color:#ffad52; }
    .legend .unresolved { color:#c94d3a; }
    .dark .legend .unresolved { color:#ff8978; }
    .connected { color:#2f7451; }
    .dark .connected { color:#69d78a; }
    .warning { color:#9b4d1f; }
    .dark .warning { color:#ffad52; }
    .brand-sprite { position:absolute; width:0; height:0; overflow:hidden; }
    svg { display:block; fill:currentColor; }
    @media(max-width:1040px){ .board{grid-template-columns:1fr}.review-head{align-items:start;flex-direction:column}.files{justify-content:flex-start} }
    @media(max-width:580px){ .review{padding:22px 10px 36px}.scene{border-radius:12px}.window{width:calc(100% - 22px)} }
  </style>
</head>
